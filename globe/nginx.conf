# Static 3D globe + read-only proxy to ClickHouse. The proxy adds the credentials of the
# read-only user `superset` (SELECT on mart.* only), so the page contains none; ClickHouse
# runs GET requests in readonly mode anyway.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /ch/ {
        limit_except GET { deny all; }
        proxy_pass http://clickhouse:8123/;
        proxy_set_header X-ClickHouse-User superset;
        proxy_set_header X-ClickHouse-Key superset;
        proxy_read_timeout 60s;
    }
}
