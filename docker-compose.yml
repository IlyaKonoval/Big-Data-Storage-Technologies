x-airflow-common:
  &airflow-common
  build: ./airflow
  image: bdst-airflow:3.0.6
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'utc'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '30'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- project settings (read by plugins/celestrak/config.py) ---
    # Endpoints and credentials are Airflow Connections (airflow/config/connections.json,
    # imported by airflow-init): clickhouse_dwh, s3_raw, openmetadata, postgres_dwh, mysql_ods.
    CELESTRAK_USER_AGENT: ${CELESTRAK_USER_AGENT:-bdst-student-project/1.0}
    S3_RAW_BUCKET: raw
    REPORTS_DIR: /opt/airflow/reports
    SQL_DIR: /opt/airflow/sql
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./sql:/opt/airflow/sql
    - ./reports:/opt/airflow/reports
    - ./airflow/config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # ---------------- Airflow metadata DB ----------------
  airflow-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---------------- Storage #0: raw files (S3) ----------------
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=256 -volume.max=100
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer UI (browse raw files)
      - "9333:9333"   # master UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: always

  # ---------------- Archived: PostgreSQL (ЛР1 comparison only) ----------------
  # Was the ODS until 17.10.2026; data migrated to ClickHouse
  # (sql/migrations/2026-10-17_postgres_to_clickhouse.sql). Start with --profile archive.
  dwh-postgres:
    image: postgres:16.4
    profiles: ["archive"]
    environment:
      POSTGRES_USER: ${DWH_PG_USER:-dwh}
      POSTGRES_PASSWORD: ${DWH_PG_PASSWORD:-dwh}
      POSTGRES_DB: dwh
    volumes:
      - dwh-postgres-data:/var/lib/postgresql/data
      - ./sql/ods/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d dwh"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---------------- Archived: MySQL (ЛР1 comparison only) ----------------
  mysql:
    image: mysql:8.4.3
    profiles: ["archive"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ods
      MYSQL_USER: ${MYSQL_USER:-dwh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwh}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--local-infile=1"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/ods/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: always

  # ---------------- Main storage: ClickHouse (ODS, meta, Data Vault) ----------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.4.13
    environment:
      CLICKHOUSE_DB: ods
      CLICKHOUSE_USER: ${CH_USER:-dwh}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-dwh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/ods/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: always

  # ---------------- Airflow ----------------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,config,reports}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        /entrypoint airflow pools set vault 1 "Serializes Data Vault loads (shared hubs)"
        # Connections: the template gets the credentials below, then is imported (upsert).
        python -c 'import os, sys; sys.stdout.write(os.path.expandvars(open(sys.argv[1]).read()))'           /opt/airflow/config/connections.json > /tmp/connections.json
        /entrypoint airflow connections import --overwrite /tmp/connections.json
        rm /tmp/connections.json
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/config
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      # Credentials of the connections (only this one-shot service sees them).
      CH_USER: ${CH_USER:-dwh}
      CH_PASSWORD: ${CH_PASSWORD:-dwh}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bdst}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bdst-secret}
      OM_ADMIN_PASSWORD: ${OM_ADMIN_PASSWORD:-admin}
      DWH_PG_USER: ${DWH_PG_USER:-dwh}
      DWH_PG_PASSWORD: ${DWH_PG_PASSWORD:-dwh}
      MYSQL_USER: ${MYSQL_USER:-dwh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwh}
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

  # ---------------- BI (ЛР3): Superset + 3D globe, profile "bi" ----------------
  # Metadata DB: database `superset` in airflow-postgres. Dashboards are code
  # (superset/bootstrap.py, run by superset-bootstrap) and read ClickHouse database `mart`
  # as the read-only user `superset`.
  superset-init:
    &superset-common
    build: ./superset
    image: bdst-superset:6.1.0
    profiles: ["bi"]
    command: ["/bin/bash", "/app/bootstrap/init.sh"]
    # Mounted over the copies in the image, so edits apply without a rebuild.
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/init.sh:/app/bootstrap/init.sh:ro
      - ./superset/bootstrap.py:/app/bootstrap/bootstrap.py:ro
    environment:
      &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-bdst-superset-local-secret-change-me}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://airflow:airflow@airflow-postgres/superset
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      GLOBE_URL: http://localhost:8090
    depends_on:
      airflow-postgres:
        condition: service_healthy

  superset:
    <<: *superset-common
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 15s
      retries: 10
      start_period: 30s
    restart: always
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  # Creates/updates the database connection, datasets, charts and the dashboard via the
  # Superset REST API (idempotent), then exits.
  superset-bootstrap:
    <<: *superset-common
    command: ["/app/.venv/bin/python", "/app/bootstrap/bootstrap.py"]
    environment:
      <<: *superset-env
      SUPERSET_URL: http://superset:8088
      CH_SUPERSET_URI: clickhousedb://superset:superset@clickhouse:8123/mart
    restart: "no"
    depends_on:
      superset:
        condition: service_healthy

  # Static 3D globe (globe.gl + satellite.js) served by nginx; /ch/ proxies read-only
  # queries to ClickHouse as user `superset`, so the page holds no credentials.
  globe:
    image: nginx:1.27.2-alpine
    profiles: ["bi"]
    volumes:
      - ./globe:/usr/share/nginx/html:ro
      - ./globe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: always

  # ---------------- Catalog + lineage (ЛР3): OpenMetadata, profile "meta" ----------------
  # Metadata DB: database `openmetadata_db` in airflow-postgres; search index: Elasticsearch.
  # Metadata comes from ingestion workflows (openmetadata/workflows/*.yaml, run by om-ingest),
  # lineage of our SQL/Python steps from celestrak.lineage (om-ingest and DAG publish_lineage).
  om-db-init:
    image: postgres:16.4
    profiles: ["meta"]
    environment:
      PGPASSWORD: airflow
    command:
      - bash
      - -c
      - >-
        psql -h airflow-postgres -U airflow -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'openmetadata_db'" | grep -q 1
        || psql -h airflow-postgres -U airflow -d postgres -c "CREATE DATABASE openmetadata_db"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  om-elasticsearch:
    image: elasticsearch:9.3.0
    profiles: ["meta"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    volumes:
      - om-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      retries: 20
    restart: always

  om-migrate:
    &om-server
    image: openmetadata/server:1.13.6
    profiles: ["meta"]
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment:
      &om-env
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: airflow-postgres
      DB_PORT: 5432
      DB_PARAMS: sslmode=disable
      DB_USER: airflow
      DB_USER_PASSWORD: airflow
      OM_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: om-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      # Ingestion runs in om-ingest, not in OpenMetadata's own Airflow.
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
    depends_on:
      om-db-init:
        condition: service_completed_successfully
      om-elasticsearch:
        condition: service_healthy
    restart: "no"

  openmetadata-server:
    <<: *om-server
    command: ["/openmetadata-start.sh"]
    ports:
      - "8585:8585"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      retries: 20
      start_period: 60s
    depends_on:
      om-migrate:
        condition: service_completed_successfully
    restart: always

  # Runs the ingestion workflows and publishes our lineage, then repeats every hour.
  # One-off run before a demo: docker compose run --rm om-ingest once
  om-ingest:
    image: openmetadata/ingestion-base:1.13.6
    profiles: ["meta"]
    entrypoint: ["python", "/opt/om/ingest.py"]
    command: ["loop"]
    environment:
      OM_URL: http://openmetadata-server:8585/api
      OM_ADMIN_EMAIL: admin@open-metadata.org
      OM_ADMIN_PASSWORD: ${OM_ADMIN_PASSWORD:-admin}
      CH_USER: ${CH_USER:-dwh}
      CH_PASSWORD: ${CH_PASSWORD:-dwh}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bdst}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bdst-secret}
      SQL_DIR: /opt/sql
      PYTHONPATH: /opt/plugins
    volumes:
      - ./openmetadata:/opt/om:ro
      - ./plugins:/opt/plugins:ro
      - ./sql:/opt/sql:ro
    depends_on:
      openmetadata-server:
        condition: service_healthy
    restart: always

volumes:
  om-es-data:
  airflow-postgres-data:
  airflow-logs:
  seaweedfs-data:
  dwh-postgres-data:
  mysql-data:
  clickhouse-data:
