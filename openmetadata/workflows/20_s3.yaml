# The raw bucket in SeaweedFS (S3 API): the start of the lineage, raw -> ods.<source>.
source:
  type: s3
  serviceName: seaweedfs
  serviceConnection:
    config:
      type: S3
      awsConfig:
        awsAccessKeyId: ${S3_ACCESS_KEY}
        awsSecretAccessKey: ${S3_SECRET_KEY}
        awsRegion: us-east-1
        endPointURL: http://seaweedfs:8333
  sourceConfig:
    config:
      type: StorageMetadata
      containerFilterPattern:
        includes: ["^raw$"]
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_URL}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT}
