dashboards:
  Околоземное пространство: >
    Аналитический дашборд. **Обзор** — что сейчас на орбите и кому принадлежит;
    **История** — рост населённости с 1957 года, темп запусков, плотность LEO;
    **Риски** — опасные сближения и расхождение NORAD с оператором. Фильтры: орбита, тип, владелец.
  Космос в 3D: >
    Интерактивный 3D-глобус (сервис `globe`, встроен iframe-ом): **Сейчас** — ~17 тыс.
    спутников в реальном времени по SGP4, космодромы, витки, места сближений;
    **Хроника 1957–2026** — таймлапс заполнения орбиты с ключевыми событиями.

# Why each chart has its type (the dashboard justification of ЛР3).
charts:
  Объектов на орбите: Big Number — одно ключевое число, которое должно читаться мгновенно.
  Активные спутники: Big Number — сколько из объектов на орбите реально работает.
  Космический мусор: Big Number — число обломков, главный показатель засорённости орбиты.
  Starlink на орбите: Big Number — масштаб одной группировки на фоне всей орбиты.
  Состав по орбитам и типам: Столбцы с накоплением — сравнение режимов орбит и долей типов объектов внутри каждого.
  Кому принадлежит орбита: Sunburst — иерархия «режим → владелец» с длинным хвостом мелких владельцев.
  Рост населённости орбиты 1957–2026: Область с накоплением — накопленный тренд по типам; видны ступени разрушений 2007, 2009, 2021.
  Запуски по годам и доля Starlink: Столбцы + линия на второй оси — объём запусков и доля Starlink на одной шкале времени.
  "Где теснее всего: высота (км) × наклонение (°)": Тепловая карта — плотность по двум непрерывным осям; оболочки Starlink и солнечно-синхронный пояс видны как яркие ячейки.
  Самые опасные сближения (прогноз SOCRATES): Таблица с условным форматированием — нужны конкретные пары, имена и значения.
  Кто с кем сближается: Круговая диаграмма — доли немногих категорий пар (спутник, обломок, ступень).
  Самые «конфликтные» объекты: Горизонтальные столбцы — ранжирование объектов по числу сближений.
  "Starlink: насколько NORAD (GP) расходится с оператором (SupGP)": Гистограмма — распределение расхождений в километрах, видны типичное значение и хвост.
